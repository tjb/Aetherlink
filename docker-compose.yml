name: sql-dojo

services:
  db:
    image: postgres:17
    container_name: sql-dojo-db
    environment:
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: dojo
      POSTGRES_DB: dojo
    ports:
      - "${DOJO_PORT:-5433}:5432"
    volumes:
      - dojo-data:/var/lib/postgresql/data
    shm_size: 1g
    # Tuned for analytics on a laptop. Every one of these is worth reading about:
    # https://www.postgresql.org/docs/17/runtime-config-resource.html
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - max_wal_size=4GB
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo -d dojo -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  dojo-data:
