name: CI

# Generates a tiny dataset and checks that every reference solution still runs,
# plus unit tests and a headless smoke test of the terminal IDE.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dojo
          POSTGRES_PASSWORD: dojo
          POSTGRES_DB: dojo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dojo" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DOJO_PSQL: psql postgresql://dojo:dojo@localhost:5432/dojo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Textual and DuckDB
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate a small dataset
        run: python dojo generate --scale 0.05 --yes
      - name: Build the data lake (Level 8)
        run: python dojo lake
      - name: Every reference solution runs (and every lab solution passes)
        run: python dojo selftest
      - name: Terminal IDE smoke test
        run: python -m unittest tests/test_tui.py -v
